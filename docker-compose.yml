services:
  db:
    image: postgres:16-alpine
    container_name: dayflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
      POSTGRES_DB: dayflow
    ports:
      - "5433:5432"
    volumes:
      - dayflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://dayflow:dayflow@db:5432/dayflow?schema=public
      JWT_SECRET: dayflow-hackathon-jwt-secret-change-in-prod
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_ROUNDS: "12"
      LATE_CHECKIN_THRESHOLD: "10:30"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: dayflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dayflow_pgdata:
